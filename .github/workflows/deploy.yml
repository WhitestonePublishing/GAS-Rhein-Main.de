# Veröffentlicht die Webseite per SFTP auf dem Strato-Webspace.
#
# Einrichtung (einmalig, im GitHub-Repository unter
# Settings → Secrets and variables → Actions):
#
#   Variables (Reiter "Variables"):
#     SFTP_HOST        Hostname oder IP des Servers (bei Plesk: der Server selbst,
#                      nicht ssh.strato.de)
#     SFTP_USER        Systembenutzer des Abonnements
#     SFTP_TARGET_DIR  Zielordner, z. B. /httpdocs
#     SFTP_PROTOCOL    optional: sftp (Standard) oder ftps
#     SFTP_PORT        optional: Standard 22 (sftp) bzw. 21 (ftps)
#
#   Secrets (Reiter "Secrets"):
#     SFTP_PASSWORD    Passwort des SFTP-Benutzers
#
# Solange etwas davon fehlt, wird der Upload übersprungen (kein Fehler).

name: Veröffentlichen (Strato SFTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-strato
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Konfiguration prüfen
        id: cfg
        env:
          HOST: ${{ vars.SFTP_HOST }}
          USER: ${{ vars.SFTP_USER }}
          DIR: ${{ vars.SFTP_TARGET_DIR }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing SFTP_HOST"
          [ -z "$USER" ] && missing="$missing SFTP_USER"
          [ -z "$DIR" ]  && missing="$missing SFTP_TARGET_DIR"
          [ -z "$PASS" ] && missing="$missing SFTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice::Upload übersprungen – noch nicht eingerichtet:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository auschecken
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: lftp installieren
        if: steps.cfg.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOST: ${{ vars.SFTP_HOST }}
          USER: ${{ vars.SFTP_USER }}
          DIR: ${{ vars.SFTP_TARGET_DIR }}
          PROTO: ${{ vars.SFTP_PROTOCOL || 'sftp' }}
          PORT: ${{ vars.SFTP_PORT }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if [ "$PROTO" = "ftps" ]; then
            PORT="${PORT:-21}"
            SETTINGS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true;"
            URL="ftp://$HOST:$PORT"
          else
            PORT="${PORT:-22}"
            SETTINGS="set sftp:auto-confirm yes;"
            URL="sftp://$HOST:$PORT"
          fi
          set -o pipefail
          echo "Verbinde mit $PROTO://$HOST:$PORT als $USER, Ziel $DIR"
          lftp -d -c "
            $SETTINGS
            set net:max-retries 2;
            set net:timeout 30;
            open --env-password -u \"$USER\" $URL;
            mirror --reverse --verbose --only-newer --parallel=4 \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob README.md \
              --exclude-glob .gitignore \
              ./ \"$DIR\";
            bye
          " 2>&1 | grep -v -i "pass"
          echo "::notice::Veröffentlicht nach $HOST:$DIR"
